{% include calculate_relative_base.html %}
{% include escape-404.html %}

<head>
	<meta charset="utf-8">
	<script>
	// 다크가 기본값(default.html 이 서버 렌더). 저장된 선택이 light 일 때만 걷어낸다.
	// 무조건 다시 씌우면 라이트를 고른 방문자에게 첫 페인트에서 다크 플래시가 남는다.
	// 저장소 계약: sessionStorage(night_mode!=='manual'), 키 'theme', {nightShift, autoToggleAt}
	try {
		var __t = JSON.parse(sessionStorage.getItem('theme') || '{}');
		if (__t.nightShift === false) { document.documentElement.removeAttribute('data-theme'); }
	} catch (e) {}
	</script>
	<title>{% if page.title %}{{page.title}} - {{site.title}}{% else %}{{site.title}}{% endif %}</title>
	<link rel="canonical" href="{{ site.url }}{{ page.url }}">
	<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	{% include SEO.html %}
	<!-- Windows Phone -->
	<meta name="msapplication-navbutton-color" content="#311e3e">
	<!-- iOS Safari -->
	<meta name="apple-mobile-web-app-status-bar-style" content="#311e3e">
	<!-- 웹폰트를 쓰지 않는다. 업스트림은 Lora / Source Sans Pro 의 @font-face 를
	     여기 인라인해 두었는데, 실제 woff2 는 fonts.gstatic.com 에서 받아온다 —
	     선언만 인라인일 뿐 자체 호스팅이 아니라서 모든 방문자의 IP 가 매 페이지마다
	     제3자에게 노출된다. 두 서체는 라틴 전용이라 한국어 본문에는 애초에 쓰이지
	     않고, --font1/--font2 에 Georgia·Helvetica 대체 스택이 이미 선언돼 있다. -->
	<!-- Font Awesome -->
	<link rel="stylesheet" href="{{ relativebase }}assets/fonts/font-awesome/css/font-awesome.min.css">
	<!-- Styles -->
	<link rel="stylesheet" href="{{ relativebase }}assets/css/main.css">
	<link rel="stylesheet" href="{{ relativebase }}assets/css/portfolio.css">
	{% include favicon.html %}
	{% if page.layout == 'post' %}
	<link rel="stylesheet" href="{{ relativebase }}assets/css/highlighter/{{ site.highlight_theme }}.css">
	{% endif %}
</head>
