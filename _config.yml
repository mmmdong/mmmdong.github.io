# Site
title:              Kim Dong Hyun
bio:                'Unity 3D/2D 게임 개발자'
description:        "Unity 3D/2D 게임 개발자 김동현 포트폴리오"
reading_time:       true
words_per_minute:   200
logo:               assets/img/profile.png
locale:             ko_KR
url:                https://mmmdong.github.io
baseurl:            ""

# Jekyll
# permalink 의 :title 은 제목이 아니라 파일명에서 날짜를 뺀 부분이다.
# 프로젝트 8건은 front matter 에 permalink 를 직접 지정해 이 규칙과 무관하다.
permalink:          /:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  input:            GFM          # 코드펜스와 <details markdown="1"> 에 필요
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
  hard_wrap:        false
encoding:           "utf-8"

# 수식을 쓰지 않는다. true 로 두면 post.html 이 cdn.mathjax.org 를 부르는데
# 그 호스트는 서비스가 종료돼 깨진 로드이면서 제3자 요청이 된다.
mathjax:            false

sass:
  sass_dir:         _sass
  style:            compressed

# 댓글을 쓰지 않는다. disqus_shortname 을 비워두면 disqus 블록이 렌더되지 않는다.
# (템플릿 기본값은 원작자 계정이었다.)

# Contact — 단일 출처. 랜딩과 CV 에서 이 값을 읽는다.
author:             Kim Dong Hyun
email:              clxlzl1234@gmail.com
phone:              "010-6299-6530"
notion:             https://www.notion.so/mmmdong/Unity-Programmer-Kim-Dong-Hyun-33c08b60233e805f929ad17f7caf3207
github-url:         mmmdong

# Plugins
# 'gems:' 는 Jekyll 3.5 에서 'plugins:' 로 바뀐 옛 키다.
plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - node_modules
  - vendor
  - _site
  - src
  - CNAME
  - Rakefile
