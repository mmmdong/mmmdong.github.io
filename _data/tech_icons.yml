# Claude Code 전용 글리프(픽셀아트 캐릭터)는 작은 크기에서 주황 덩어리로만
# 보인다. 이름표를 글자로 내지 않으니 글리프가 어느 브랜드인지 혼자 알려야
# 하는데 그걸 못 한다. 작은 크기에서도 형태가 남는 Claude 본 마크를 쓴다.
