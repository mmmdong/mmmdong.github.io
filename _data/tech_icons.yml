  file: spine.svg
  url: https://esotericsoftware.com/
- name: Git
  file: git.svg
  url: https://git-scm.com/
- name: Jenkins
  file: jenkins.svg
  url: https://www.jenkins.io/
# 스팀은 스토어가 아니라 개발자용 Steamworks 를 건다 — 여기 실린 작업이
# 플랫폼 연동이라서다.
