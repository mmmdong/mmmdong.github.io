  file: claude.svg
  url: https://claude.com/product/claude-code
# oh-my-claudecode 는 공개 로고가 없다. 저장소의 마스코트는 픽셀아트 캐릭터라
# 38px 에서는 붉은 덩어리로만 보여서, cpp.png 와 같은 방식의 모노그램 배지를
# 만들어 쓴다. 색은 OMC 소셜 이미지의 제목 빨강을 흰 글자가 4.5:1 을 넘길
